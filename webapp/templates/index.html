  document.getElementById(`${id}-dat`).classList.add("active");
}

// geneState data store: gene -> { src: data }
const collectorData = {};

function updateCollectorChip(gene, source, ok, summary, data) {
  const id = cardId(gene);
  let chip = document.getElementById(`${id}-chip-${source}`);
  if (!chip) {
    // 初期リストにないソース（pathway_fit など後から追加されるもの）は動的に生成
    const grid = document.getElementById(id + "-collector-grid");
    if (grid) {
      chip = document.createElement("div");
      chip.id = `${id}-chip-${source}`;
      grid.appendChild(chip);
    }
  }
  if (chip) {
    chip.className = `collector-chip ${ok ? "ok" : "err"}`;
    chip.innerHTML = `
      <div class="chip-name">${SRC_LABEL[source] || source}</div>
      <div class="chip-detail">${summary || (ok ? "取得済み" : "エラー")}</div>`;
    chip.style.cursor = "pointer";
    chip.onclick = () => showDataDetail(gene, source);
  }
  if (!collectorData[gene]) collectorData[gene] = {};
  collectorData[gene][source] = data;

  // 現在この source の詳細を表示中なら再描画（機能情報の後付け更新に対応）
  const detailEl = document.getElementById(id + "-data-detail");
  if (detailEl && detailEl.dataset.currentSource === source) {
    showDataDetail(gene, source);
  }
}

function showDataDetail(gene, source) {
  const id = cardId(gene);
  const el = document.getElementById(id + "-data-detail");
  if (!el) return;
  el.dataset.currentSource = source;
  const data = (collectorData[gene] || {})[source];
  el.innerHTML = `<div class="data-section">
    <div class="data-section-title">${SRC_LABEL[source] || source}</div>
    ${renderDataDetail(source, data, gene)}
  </div>`;
}

function renderDataDetail(source, data, gene) {
  if (!data) return '<span style="color:var(--text-sub);font-size:13px;">データなし</span>';
  try {
    if (source === "pubmed" && data.papers) {
      const nClin = data.papers.filter(p => p.is_clinical).length;
      const nMoa  = data.papers.length - nClin;
      const summary = `<p style="font-size:12px;color:var(--text-sub);margin-bottom:8px;">
        直近の論文 最大トップ100件を表示。<strong>臨床妥当性</strong>（臨床試験・患者データの実施例 ${nClin}件）と
        <strong>MoA妥当性</strong>（標的-疾患の機序・機能的根拠 ${nMoa}件）の両観点で使用します。</p>`;
      const paperHtml = p => `
        <div style="margin-bottom:12px;padding:10px;border:1px solid var(--border);border-radius:7px;">
          <div style="font-weight:600;font-size:13px;">
            ${p.is_clinical
              ? '<span class="badge" style="background:#dcfce7;color:#166534;">臨床妥当性</span> '
              : '<span class="badge" style="background:#e0e7ff;color:#3730a3;">MoA妥当性</span> '}
            ${esc(p.title)}
          </div>
          <div style="font-size:11px;color:var(--text-sub);margin:3px 0;">${esc(p.journal)} ${p.year}
            ${(p.url || p.pmid) ? `· <a href="${esc(p.url || `https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`)}" target="_blank">${p.pmid ? `PMID:${p.pmid}` : esc(p.pmid || "Europe PMC")}</a>` : ""}
            ${(p.pub_types||[]).length ? `· ${esc(p.pub_types.join(", "))}` : ""}
          </div>
          <div class="abstract-text">${esc(p.abstract)}${p.abstract ? "..." : ""}</div>
        </div>`;
      // 仮説で使用された論文（タグ付き）を先頭に表示
      const cited = gene ? ((collectorData[gene] || {})["_cited_papers"] || []) : [];
      let citedHtml = "";
      if (cited.length) {
        const citedRows = cited.map(p => `
          <div style="display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;min-width:72px;">${esc(p.tag)}</span>
            <span style="font-size:12px;">${p.url
              ? `<a href="${esc(p.url)}" target="_blank">${esc(p.title)}</a>`
              : esc(p.title)}</span>
          </div>`).join("");
        citedHtml = `<div style="margin-bottom:14px;padding:10px;background:var(--bg-sub,#f0f4ff);border-radius:7px;border:1px solid var(--accent);">
          <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;">📄 仮説で引用された論文 — ${cited.length}件（[Paper N] タグ対応）</div>
          ${citedRows}
        </div>`;
      }
      return citedHtml + summary + data.papers.map(paperHtml).join("");
    }
    if (source === "opentargets" && data) {
      const otLinks = [];
      if (data.ensembl_id) otLinks.push(`<a href="https://platform.opentargets.org/target/${esc(data.ensembl_id)}" target="_blank">🔗 Target を OpenTargets で見る</a>`);
      if (data.disease_id) otLinks.push(`<a href="https://platform.opentargets.org/disease/${esc(data.disease_id)}" target="_blank">🔗 Disease を OpenTargets で見る</a>`);
      // disease_id と disease_label を表示（ID が間違っているとスコアが 0 になるため診断用に常時表示）
      const idInfoHtml = `<div style="margin-bottom:8px;font-size:11px;color:var(--text-sub);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:5px 8px;">
        <span>使用 Disease ID: <code>${esc(data.disease_id||"—")}</code>${data.disease_label ? ` (${esc(data.disease_label)})` : ""}</span><br>
        <span>使用 Gene ID: <code>${esc(data.ensembl_id||"—")}</code></span>
        ${data.association_score === null || data.association_score === 0
          ? ' <span style="color:var(--warn);font-weight:600;">⚠ スコア0 → Disease IDが正しいかリンクで確認してください</span>'
          : ''}
      </div>`;
      const otLinkHtml = otLinks.length ? `<div style="margin-bottom:6px;font-size:12px;">${otLinks.join(" ｜ ")}</div>` : "";
      const dt = data.datatype_scores || {};
      const scoreRows = Object.entries(dt).map(([k,v]) =>
        `<tr><td>${esc(k)}</td><td><div style="background:#dbeafe;width:${Math.round(v*100)}%;height:10px;border-radius:3px;display:inline-block;min-width:4px;"></div> ${(+v).toFixed(3)}</td></tr>`
      ).join("");
      const drugs = (data.drugs || []).map(d => `<tr>
        <td>${esc(d.name)}</td>
        <td><span class="badge">Phase ${d.phase||"?"}</span></td>
        <td>${esc(d.indication)}</td></tr>`).join("");
      // Associated diseases (top 20) with datatype score breakdown
      const DT_COLS = ["genetic_association","literature","animal_model","affected_pathway","somatic_mutation","known_drug","rna_expression"];
      const DT_LABEL = {genetic_association:"遺伝",literature:"文献",animal_model:"動物",affected_pathway:"経路",somatic_mutation:"体細胞",known_drug:"薬剤",rna_expression:"発現"};
      const cell = v => {
        if (v == null) return '<td style="color:var(--border);text-align:center;">·</td>';
        const pct = Math.round(v*100);
        return `<td style="text-align:center;white-space:nowrap;">
          <div style="display:inline-block;width:${Math.max(4,pct*0.4)}px;height:9px;border-radius:2px;background:rgba(37,99,235,${0.25+v*0.75});vertical-align:middle;"></div>
          <span style="font-size:10px;margin-left:3px;">${(+v).toFixed(3)}</span></td>`;
      };
      const dis = (data.associated_diseases || []).map(a => {
        const ds = a.datatype_scores || {};
        return `<tr>
          <td style="min-width:150px;">${esc(a.name)}</td>
          <td class="pval" style="text-align:center;">${(+a.score).toFixed(3)}</td>
          ${DT_COLS.map(c => cell(ds[c])).join("")}
        </tr>`;
      }).join("");
      const disHead = DT_COLS.map(c => `<th style="text-align:center;font-size:10px;">${DT_LABEL[c]}</th>`).join("");
      return `${idInfoHtml}${otLinkHtml}<div class="metric-row">
        <div class="metric"><div class="metric-val">${(+(data.association_score||0)).toFixed(3)}</div><div class="metric-label">Total Score</div></div>
        <div class="metric"><div class="metric-val">${(+(data.genetic_score||0)).toFixed(3)}</div><div class="metric-label">Genetic Score</div></div>
      </div>
      ${scoreRows ? `<div class="data-section-title">この疾患のデータタイプ別スコア</div>
      <table class="data-table"><thead><tr><th>データタイプ</th><th>スコア</th></tr></thead><tbody>${scoreRows}</tbody></table>` : ""}
      ${drugs ? `<div class="data-section-title" style="margin-top:10px;">薬剤・臨床候補</div>
      <table class="data-table"><thead><tr><th>薬剤名</th><th>Phase</th><th>適応</th></tr></thead><tbody>${drugs}</tbody></table>` : '<div style="font-size:12px;color:var(--text-sub);margin-top:8px;">承認薬・臨床候補なし</div>'}
      ${dis ? `<div class="data-section-title" style="margin-top:10px;">関連疾患 Top ${(data.associated_diseases||[]).length}（スコア内訳）</div>
      <table class="data-table"><thead><tr><th>疾患</th><th style="text-align:center;">総合</th>${disHead}</tr></thead><tbody>${dis}</tbody></table>` : ""}`;
    }
    if (source === "uniprot" && data) {
      const go = (data.go_terms||[]).map(g=>`<li>${esc(g)}</li>`).join("");
      const loc = (data.subcellular_location||[]).join(", ");
      const link = data.accession
        ? `<div style="margin-bottom:8px;font-size:12px;"><a href="https://www.uniprot.org/uniprotkb/${esc(data.accession)}" target="_blank">🔗 UniProt (${esc(data.accession)}) で見る</a></div>`
        : "";
      return `${link}<div style="margin-bottom:10px;"><strong>${esc(data.protein_name||"")}</strong></div>
        ${data.function ? `<div class="abstract-text" style="margin-bottom:10px;">${esc(data.function)}</div>` : ""}
        ${loc ? `<div style="font-size:12px;margin-bottom:6px;"><strong>局在:</strong> ${esc(loc)}</div>` : ""}
        ${go ? `<div class="data-section-title">GO Terms</div><ul style="font-size:12px;padding-left:18px;">${go}</ul>` : ""}`;
    }
    if (source === "gwas" && data.hits) {
      const rows = data.hits.map(h => {
        const rsids = h.rsids || [];
        const variantHtml = rsids.length
          ? rsids.map(rs => `<a href="https://www.ncbi.nlm.nih.gov/snp/${esc(rs)}" target="_blank"><code>${esc(rs)}</code></a>`).join(", ")
          : esc(h.variant);
        const traitHtml = h.gwas_url
          ? `<a href="${esc(h.gwas_url)}" target="_blank">${esc(h.trait)}</a>`
          : esc(h.trait);
        return `<tr>
        <td>${traitHtml}</td><td>${variantHtml}</td>
        <td class="pval">${h.pvalue}</td><td>${h.beta||""}</td></tr>`;
      }).join("");
      return `<table class="data-table"><thead><tr><th>形質</th><th>バリアント</th><th>p値</th><th>Beta</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    if (source === "clinvar" && data.variants) {
      const note = `<p style="font-size:12px;color:var(--text-sub);margin-bottom:8px;">
        疾患名が分類されているバリアントを中心に、最大100件を表示（該当 ${data.total ?? data.variants.length}件）。</p>`;
      const rows = data.variants.map(v => {
        const nameHtml = v.variant_id
          ? `<a href="https://www.ncbi.nlm.nih.gov/clinvar/variation/${esc(v.variant_id)}/" target="_blank">${esc(v.name)}</a>`
          : esc(v.name);
        return `<tr>
        <td>${nameHtml}</td><td>${esc(v.significance)}</td><td>${esc(v.condition)}</td>
        <td style="font-size:11px;color:var(--text-sub);">${esc(v.review||"")}</td></tr>`;
      }).join("");
      return note + `<table class="data-table"><thead><tr><th>バリアント</th><th>臨床的意義</th><th>疾患</th><th>レビュー状況</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    if (source === "chembl" && data.drugs) {
      if (!data.drugs.length) return '<span style="color:var(--text-sub);font-size:13px;">承認薬・臨床候補なし（ChEMBL）</span>';
      const note = `<p style="font-size:12px;color:var(--text-sub);margin-bottom:8px;">
        最大100件を表示（該当 ${data.total ?? data.drugs.length}件）。</p>`;
      const rows = data.drugs.map(d => {
        const nameHtml = d.chembl_id
          ? `<a href="https://www.ebi.ac.uk/chembl/explore/compound/${esc(d.chembl_id)}" target="_blank">${esc(d.name)}</a>`
          : esc(d.name);
        return `<tr>
        <td style="font-family:monospace;font-weight:600;">${nameHtml}</td>
        <td><span class="badge">Phase ${d.phase!=null?d.phase:"?"}</span></td>
        <td>${esc(d.mechanism)}</td><td>${esc(d.type||"")}</td></tr>`;
      }).join("");
      return note + `<table class="data-table"><thead><tr><th>薬剤名</th><th>Phase</th><th>作用機序</th><th>種別</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    if (source === "gnomad") {
      const fmt = v => (typeof v === "number") ? v.toPrecision(3) : (v ?? "N/A");
      const link = data.url ? `<div style="margin-bottom:8px;font-size:12px;"><a href="${esc(data.url)}" target="_blank">🔗 gnomAD で見る</a></div>` : "";
      return `${link}<div class="metric-row">
        <div class="metric"><div class="metric-val">${fmt(data.pli)}</div><div class="metric-label">pLI</div></div>
        <div class="metric"><div class="metric-val">${fmt(data.loeuf)}</div><div class="metric-label">LOEUF</div></div>
        <div class="metric"><div class="metric-val">${fmt(data.lof_z)}</div><div class="metric-label">LoF Z</div></div>
      </div>
      <div style="font-size:12px;color:var(--text-sub);margin-top:4px;">
        観測LoF ${data.obs_lof ?? "?"} / 期待 ${typeof data.exp_lof==="number"?data.exp_lof.toFixed(1):"?"}<br>${esc(data.essentiality||"")}</div>`;
    }
    if (source === "gtex" && data) {
      const tissues = data.tissues || [];
      const maxTpm = tissues[0] ? tissues[0].tpm : 1;
      const rows = tissues.map(t => {
        const pct = Math.min(100, ((+t.tpm) / (maxTpm||1)) * 100);
        return `<tr><td>${esc(t.tissue)}</td>
          <td><div style="background:#dbeafe;width:${pct.toFixed(0)}%;min-width:4px;height:12px;border-radius:3px;display:inline-block;"></div>
              <span style="margin-left:6px;">${(+t.tpm).toFixed(1)} TPM</span></td></tr>`;
      }).join("");
      const keyRows = (data.key_tissues||[]).filter(t=>t.tpm>0).map(t=>`<tr><td>${esc(t.tissue)}</td><td>${(+t.tpm).toFixed(1)} TPM</td></tr>`).join("");
      const link = data.url ? `<div style="margin-bottom:8px;font-size:12px;"><a href="${esc(data.url)}" target="_blank">🔗 GTEx Portal で見る</a></div>` : "";
      return `${link}<div class="data-section-title">全組織 Top ${tissues.length}</div>
        <table class="data-table"><thead><tr><th>組織</th><th>発現量</th></tr></thead><tbody>${rows}</tbody></table>
        ${keyRows?`<div class="data-section-title" style="margin-top:12px;">安全性関連組織</div>
        <table class="data-table"><thead><tr><th>組織</th><th>TPM</th></tr></thead><tbody>${keyRows}</tbody></table>`:""}`;
    }
    if (source === "hpa" && data) {
      const loc = (data.subcellular||[]).join(", ");
      const barCell = (val, max, unit, color) => {
        const pct = max > 0 ? Math.min(100, (val / max) * 100) : 0;
        return `<td><div style="background:${color||'#dbeafe'};width:${pct.toFixed(0)}%;min-width:4px;height:12px;border-radius:3px;display:inline-block;"></div>
              <span style="margin-left:6px;">${val.toFixed(1)} ${unit}</span></td>`;
      };
      const tissues = data.tissues || [];
      const maxTpm = tissues[0] ? tissues[0].tpm : 1;
      const rnaRows = tissues.map(t=>`<tr><td>${esc(t.tissue||"")}</td><td style="font-size:11px;color:var(--text-sub);">${esc(t.organ||"")}</td>${barCell(+t.tpm||0, maxTpm, "nTPM")}</tr>`).join("");
      const protRows = (data.protein_tissue||[]).map(t=>`<tr><td>${esc(t.tissue||"")}</td><td>${esc(t.level||"")}</td></tr>`).join("");
      const singleCell = data.single_cell || [];
      const maxNcpm = singleCell[0] ? singleCell[0].ncpm : 1;
      const scRows = singleCell.map(c=>`<tr><td>${esc(c.cell_type||"")}</td><td style="font-size:11px;color:var(--text-sub);">${esc(c.group||"")}</td>${barCell(+c.ncpm||0, maxNcpm, "nCPM", "#d1fae5")}</tr>`).join("");
      const cancerRows = (data.cancer||[]).map(c=>`<tr><td>${esc(c.cancer_type||"")}</td><td style="font-size:11px;color:var(--text-sub);">${esc(c.organ||"")}</td><td>${esc(c.high)}/${esc(c.medium)}/${esc(c.low)}/${esc(c.not_detected)}</td>${barCell(+c.pct_high_medium||0, 100, "%", "#fecaca")}</tr>`).join("");
      const link = data.url ? `<div style="margin-bottom:8px;font-size:12px;"><a href="${esc(data.url)}" target="_blank">🔗 Human Protein Atlas で見る</a></div>` : "";
      return `${link}${loc?`<div style="font-size:12px;margin-bottom:10px;"><strong>細胞内局在:</strong> ${esc(loc)}</div>`:""}
        ${rnaRows?`<div class="data-section-title">全組織 RNA 発現 (nTPM) — ${tissues.length}組織</div>
        <table class="data-table"><thead><tr><th>組織</th><th>器官</th><th>発現量</th></tr></thead><tbody>${rnaRows}</tbody></table>`:""}
        ${protRows?`<div class="data-section-title" style="margin-top:10px;">タンパク質発現 (intensity)</div>
        <table class="data-table"><thead><tr><th>組織</th><th>強度</th></tr></thead><tbody>${protRows}</tbody></table>`:""}
        ${scRows?`<div class="data-section-title" style="margin-top:10px;">全細胞種 RNA 発現 (nCPM) — ${singleCell.length}細胞種</div>
        <table class="data-table"><thead><tr><th>細胞種</th><th>グループ</th><th>発現量</th></tr></thead><tbody>${scRows}</tbody></table>`:""}
        ${cancerRows?`<div class="data-section-title" style="margin-top:10px;">全がん種 タンパク質発現 (IHC) — ${(data.cancer||[]).length}がん種</div>
        <p style="font-size:11px;color:var(--text-sub);margin:4px 0;">高/中/低/検出なし の患者数（免疫組織染色）</p>
        <table class="data-table"><thead><tr><th>がん種</th><th>器官</th><th>高/中/低/なし</th><th>高中率</th></tr></thead><tbody>${cancerRows}</tbody></table>`:""}`;
    }
    if (source === "clinicaltrials" && data.trials) {
      const nActive = data.trials.filter(t=>t.is_active).length;
      const note = `<p style="font-size:12px;color:var(--text-sub);margin-bottom:8px;">
        現在進行中の試験（募集中/実施中）を優先し、最大100件を表示（進行中 ${nActive}件 / 該当 ${data.total ?? data.trials.length}件）。</p>`;
      const rows = data.trials.map(t=>{
        const titleHtml = t.url
          ? `<a href="${esc(t.url)}" target="_blank">${esc(t.title)}</a>`
          : (t.nct_id ? `<a href="https://clinicaltrials.gov/study/${esc(t.nct_id)}" target="_blank">${esc(t.title)}</a>` : esc(t.title));
        const collabs = (t.collaborators||[]).length
          ? `<div style="font-size:10px;color:var(--text-sub);">+ ${esc(t.collaborators.join(", "))}</div>` : "";
        const statusHtml = t.is_active
          ? `<span class="badge" style="background:#dcfce7;color:#166534;">${esc(t.status)}</span>`
          : esc(t.status);
        return `<tr><td>${titleHtml}</td>
        <td><span class="badge">${esc(t.phase||"N/A")}</span></td>
        <td>${statusHtml}</td>
        <td style="font-size:11px;color:var(--text-sub);">${esc(t.start_date||"N/A")}</td>
        <td style="font-size:12px;">${esc(t.sponsor||"—")}${collabs}</td></tr>`;
      }).join("");
      return note + `<table class="data-table"><thead><tr><th>試験名</th><th>Phase</th><th>状況</th><th>開始日</th><th>スポンサー</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    if (source === "alphafold") {
      const plddt = (typeof data.plddt === "number") ? data.plddt.toFixed(1) : "N/A";
      return `<div class="metric-row">
        <div class="metric"><div class="metric-val">${plddt}</div><div class="metric-label">平均 pLDDT</div></div>
        <div class="metric"><div class="metric-val" style="font-size:13px;">${esc(data.confidence||"N/A")}</div><div class="metric-label">信頼度</div></div>
      </div>
      ${data.view_url ? `<div style="margin-top:8px;"><a href="${esc(data.view_url)}" target="_blank" class="btn btn-secondary btn-sm">🔬 AlphaFold構造を見る (${esc(data.uniprot_id||"")})</a></div>` : ""}`;
    }
    if (source === "intact" && data && data.interactions) {
      const rows = data.interactions.map(d => `<tr>
        <td style="font-family:monospace;font-weight:600;">${esc(d.partner)}</td>
        <td>${esc(d.type)}</td>
        <td style="font-size:11px;">${esc(d.method)}</td>
        <td class="pval">${d.score != null ? (+d.score).toFixed(3) : "—"}</td>
        <td>${d.pmid ? `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(d.pmid)}" target="_blank">${esc(d.pmid)}</a>` : "—"}</td>
      </tr>`).join("");
      return rows
        ? `<table class="data-table"><thead><tr><th>パートナー</th><th>タイプ</th><th>検出法</th><th>MI score</th><th>PMID</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<span style="color:var(--text-sub)">インタラクションなし</span>';
    }
    if ((source === "signor" || source === "biogrid" || source === "string") && data && data.interactions) {
      const rows = data.interactions.map(d => {
        const func = d.function || "";
        const funcShort = func.length > 90 ? func.slice(0, 90) + "…" : func;
        // 遺伝子シンボル → NCBI Gene リンク
        const geneLink = d.partner
          ? `<a href="https://www.ncbi.nlm.nih.gov/gene/?term=${encodeURIComponent(d.partner)}+AND+human[orgn]" target="_blank">${esc(d.partner)}</a>`
          : "—";
        // タンパク質名 → UniProt リンク（accession があれば直接、無ければ検索）
        let proteinLink = "";
        if (d.protein_name) {
          const uniprotUrl = d.accession
            ? `https://www.uniprot.org/uniprotkb/${encodeURIComponent(d.accession)}`
            : `https://www.uniprot.org/uniprotkb?query=${encodeURIComponent(d.partner||"")}+AND+organism_id:9606`;
          proteinLink = `<div style="font-weight:600;"><a href="${uniprotUrl}" target="_blank">${esc(d.protein_name)}</a></div>`;
        }
        return `<tr>
        <td style="font-family:monospace;font-weight:600;vertical-align:top;">${geneLink}</td>
        <td style="vertical-align:top;">${esc(d.effect||"")}</td>
        <td style="font-size:11px;vertical-align:top;">${esc(d.mechanism||"")}</td>
        <td style="text-align:center;vertical-align:top;">${esc(d.direction||"")}</td>
        <td class="pval" style="vertical-align:top;">${d.score != null ? (+d.score).toFixed(3) : "—"}${d.score_inferred ? '<br><span style="font-size:10px;color:var(--text-sub);font-weight:400;" title="スコア未提供のため、パートナーの接続数の逆数を代用">(推定)</span>' : ''}</td>
        <td style="font-size:11px;color:var(--text-sub);max-width:260px;" title="${esc(func)}">${proteinLink}${esc(funcShort)}</td>
      </tr>`;
      }).join("");
      return rows
        ? `<table class="data-table"><thead><tr><th>パートナー</th><th>効果</th><th>機序</th><th>方向</th><th>score</th><th>タンパク質機能 (UniProt)</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<span style="color:var(--text-sub)">インタラクションなし</span>';
    }
    if (source === "dgidb" && data && data.interactions) {
      const rows = data.interactions.map(d=>{
        const drugLink = `<a href="https://dgidb.org/results?searchType=drug&searchTerms=${encodeURIComponent(d.drug||"")}" target="_blank">${esc(d.drug)}</a>`;
        const approvedBadge = d.approved ? '<span class="badge">承認薬</span>' : '';
        const sources = (d.sources||[]).join(", ");
        const pmidLinks = (d.pmids||[]).map(pm =>
          `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(pm)}" target="_blank">${esc(pm)}</a>`).join(", ");
        const scoreStr = (typeof d.score === "number") ? d.score.toFixed(2) : "—";
        return `<tr><td style="font-family:monospace;">${drugLink} ${approvedBadge}</td>
        <td>${d.type ? esc(d.type) : '<span style="color:var(--text-sub)">不明</span>'}</td>
        <td class="pval">${scoreStr}</td>
        <td style="font-size:11px;color:var(--text-sub);">${esc(sources)}</td>
        <td style="font-size:11px;">${pmidLinks || "—"}</td></tr>`;
      }).join("");
      const note = `<p style="font-size:12px;color:var(--text-sub);margin-bottom:8px;">
        最大100件を表示（該当 ${data.total ?? data.interactions.length}件）。</p>`;
      return rows
        ? note + `<table class="data-table"><thead><tr><th>薬剤</th><th>相互作用タイプ</th><th>スコア</th><th>ソース</th><th>PMID</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<span style="color:var(--text-sub)">インタラクションなし</span>';
    }
    if (source === "reactome" && data.pathways) {
      if (!data.pathways.length) return '<span style="color:var(--text-sub);font-size:13px;">Reactomeパスウェイなし（この遺伝子のアノテーションは限定的）</span>';
      const rows = data.pathways.map(p=>`<tr>
        <td>${esc(p.name)} ${p.is_disease?'<span class="badge low">disease</span>':''}</td>
        <td style="font-size:11px;"><a href="https://reactome.org/PathwayBrowser/#/${esc(p.id)}" target="_blank">${esc(p.id)}</a></td></tr>`).join("");
      return `<table class="data-table"><thead><tr><th>パスウェイ</th><th>ID</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    if (source === "pathway_fit") {
      const score = (data.pathway_overlap_score ?? 0).toFixed(3);
      const nIn   = (data.target_in_disease_pathways || []).length;
      const nDp   = (data.disease_pathways || []).length;
      // ターゲット遺伝子が疾患パスウェイに含まれるかどうかのサマリー
      let inPathHtml = "";
      if (nIn > 0) {
        const inRows = (data.target_in_disease_pathways || []).map(p => `<tr>
          <td>${p.url ? `<a href="${esc(p.url)}" target="_blank">${esc(p.name)}</a>` : esc(p.name)}</td>
          <td style="font-size:11px;">${esc(p.pathway_id||"")}</td>
          <td>${p.is_disease ? '<span class="badge low">disease</span>' : ''}</td></tr>`).join("");
        inPathHtml = `<h4 style="margin:12px 0 6px;font-size:13px;">✅ ターゲット遺伝子が含まれる疾患パスウェイ (${nIn} 件)</h4>
          <table class="data-table"><thead><tr><th>パスウェイ名</th><th>ID</th><th></th></tr></thead><tbody>${inRows}</tbody></table>`;
      } else {
        inPathHtml = `<p style="font-size:12px;color:var(--text-sub);margin:8px 0;">ターゲット遺伝子は疾患上位パスウェイに直接含まれていません（間接的な関連の可能性あり）</p>`;
      }
      // 疾患上位遺伝子のエンリッチメントパスウェイ一覧
      const srcBadge = s => s === "REAC" ? "🔴 Reactome" : s === "KEGG" ? "🟡 KEGG" : s === "GO:BP" ? "🔵 GO:BP" : s === "WP" ? "🟢 WP" : s;
      const dpRows = (data.disease_pathways || []).map(p => {
        const pval = p.p_value < 0.001 ? p.p_value.toExponential(2) : p.p_value.toFixed(4);
        const genes = (p.genes || []).slice(0, 5).join(", ");
        return `<tr>
          <td style="font-size:11px;">${srcBadge(p.source)}</td>
          <td>${esc(p.name)}</td>
          <td style="font-size:11px;">${pval}</td>
          <td style="font-size:11px;">${p.intersection_size || ""}</td>
          <td style="font-size:11px;color:var(--text-sub);">${esc(genes)}${(p.genes||[]).length>5?" ...":""}</td></tr>`;
      }).join("");
      const dpHtml = nDp > 0
        ? `<h4 style="margin:12px 0 6px;font-size:13px;">疾患上位遺伝子のエンリッチメントパスウェイ (上位 ${nDp} 件)</h4>
           <table class="data-table"><thead><tr><th>DB</th><th>パスウェイ名</th><th>p値</th><th>ヒット遺伝子数</th><th>代表遺伝子</th></tr></thead><tbody>${dpRows}</tbody></table>`
        : "";
      return `<div class="metric-row">
          <div class="metric"><div class="metric-val">${score}</div><div class="metric-label">パスウェイ重複スコア</div></div>
          <div class="metric"><div class="metric-val">${nIn}</div><div class="metric-label">直接一致パスウェイ</div></div>
          <div class="metric"><div class="metric-val">${nDp}</div><div class="metric-label">疾患エンリッチパスウェイ</div></div>
        </div>${inPathHtml}${dpHtml}`;
    }
    if (source === "network_overlap") {
      const ws   = (data.weighted_score ?? 0).toFixed(3);
      const sr   = ((data.simple_ratio ?? 0) * 100).toFixed(1);
      const ov   = data.overlap_count ?? 0;
      const dg   = data.disease_gene_count ?? 0;
      const pp   = data.ppi_partner_count ?? 0;
      // ターゲット自身の行
      const selfHtml = data.target_self
        ? (() => {
            const ss = (data.target_self_score ?? 0).toFixed(3);
            const bw = Math.round((data.target_self_score ?? 0) * 100);
            return `<h4 style="margin:12px 0 4px;font-size:13px;">ターゲット自身の疾患遺伝子スコア</h4>
              <table class="data-table"><tbody><tr>
                <td style="font-weight:600;color:var(--primary);">★ ${esc(data.target_self)}</td>
                <td><div style="background:#bfdbfe;width:${bw}%;height:10px;border-radius:3px;display:inline-block;min-width:4px;"></div> ${ss}</td>
              </tr></tbody></table>`;
          })()
        : `<p style="font-size:12px;color:var(--text-sub);margin:8px 0;">ターゲット自身は疾患上位遺伝子リストに含まれていません</p>`;
      const genes = (data.overlapping_genes || []);
      const rows = genes.map(g => {
        const score = (g.score ?? 0).toFixed(3);
        const barW  = Math.round((g.score ?? 0) * 100);
        return `<tr>
          <td style="font-weight:600;">${esc(g.symbol||"")}</td>
          <td><div style="background:#dbeafe;width:${barW}%;height:10px;border-radius:3px;display:inline-block;min-width:4px;"></div> ${score}</td>
        </tr>`;
      }).join("");
      const tableHtml = rows
        ? `<h4 style="margin:12px 0 4px;font-size:13px;">PPIパートナー × 疾患遺伝子 重複一覧</h4>
           <table class="data-table"><thead><tr><th>重複遺伝子</th><th>OT スコア</th></tr></thead><tbody>${rows}</tbody></table>`
        : `<p style="font-size:12px;color:var(--text-sub);">PPI パートナーと疾患遺伝子の重複なし</p>`;
      return `<div class="metric-row">
          <div class="metric"><div class="metric-val" style="color:var(--primary);">${ws}</div><div class="metric-label">重み付きスコア</div></div>
          <div class="metric"><div class="metric-val">${sr}%</div><div class="metric-label">単純重複率</div></div>
          <div class="metric"><div class="metric-val">${ov} / ${dg}</div><div class="metric-label">重複 / 疾患遺伝子数</div></div>
          <div class="metric"><div class="metric-val">${pp}</div><div class="metric-label">PPIパートナー数</div></div>
        </div>
        <p style="font-size:11px;color:var(--text-sub);margin:4px 0 10px;">
          重み付きスコア = (ターゲット自身 + PPIパートナー重複) の OT スコア合計 / 全疾患遺伝子スコア合計
        </p>
        ${selfHtml}${tableHtml}`;
    }
    if (source === "hpo_overlap") {
      if (data.error) return `<p style="color:var(--danger);">${esc(data.error)}</p>`;
      const sc  = (data.overlap_score ?? 0).toFixed(3);
      const ov  = data.overlap_count ?? 0;
      const pp  = data.ppi_partner_count ?? 0;
      const nt  = data.hpo_term_count ?? 0;
      const tih = data.target_in_hpo;
      const selfHtml = tih
        ? `<p style="font-size:12px;color:var(--primary);margin:6px 0;">★ ターゲット遺伝子自身も HPO 症状関連遺伝子に含まれています</p>`
        : `<p style="font-size:12px;color:var(--text-sub);margin:6px 0;">ターゲット自身は HPO 症状関連遺伝子リストに含まれていません</p>`;
      // top genes table
      const topGenes = (data.top_genes || []);
      const tgRows = topGenes.map(g => {
        const barW = Math.round((g.term_count / Math.max(1, nt)) * 100);
        return `<tr>
          <td style="font-weight:600;">${esc(g.symbol)}</td>
          <td><div style="background:#d1fae5;width:${Math.min(barW,100)}%;height:10px;border-radius:3px;display:inline-block;min-width:4px;"></div> ${g.term_count} 症状</td>
        </tr>`;
      }).join("");
      const tgHtml = tgRows
        ? `<h4 style="margin:12px 0 4px;font-size:13px;">多くの症状に関連する重複 PPI パートナー (上位)</h4>
           <table class="data-table"><thead><tr><th>PPI パートナー</th><th>関連する症状数</th></tr></thead><tbody>${tgRows}</tbody></table>`
        : `<p style="font-size:12px;color:var(--text-sub);">重複する遺伝子なし</p>`;
      // per-term table
      const perTerm = (data.per_term || []);
      const ptRows = perTerm.map(t => {
        const gs = (t.overlap_genes || []).join(", ");
        return `<tr>
          <td style="font-size:11px;"><a href="https://hpo.jax.org/app/browse/term/${esc(t.hpo_id)}" target="_blank">${esc(t.hpo_id)}</a></td>
          <td>${esc(t.name)}</td>
          <td style="font-size:11px;color:var(--text-sub);">${esc(t.frequency||"")}</td>
          <td style="font-weight:600;color:var(--primary);">${t.overlap_count}</td>
          <td style="font-size:11px;">${esc(gs)}</td>
        </tr>`;
      }).join("");
      const ptHtml = ptRows
        ? `<h4 style="margin:12px 0 4px;font-size:13px;">HPO症状ごとの PPI 重複 (重複あり ${perTerm.length} 件)</h4>
           <table class="data-table"><thead><tr><th>HPO ID</th><th>症状名</th><th>頻度</th><th>重複数</th><th>重複遺伝子</th></tr></thead><tbody>${ptRows}</tbody></table>`
        : `<p style="font-size:12px;color:var(--text-sub);">症状ごとの重複データなし</p>`;
      return `<div class="metric-row">
          <div class="metric"><div class="metric-val" style="color:var(--primary);">${sc}</div><div class="metric-label">重複スコア</div></div>
          <div class="metric"><div class="metric-val">${ov} / ${pp}</div><div class="metric-label">重複 / PPIパートナー数</div></div>
          <div class="metric"><div class="metric-val">${nt}</div><div class="metric-label">HPO症状数</div></div>
          <div class="metric"><div class="metric-val">${data.total_hpo_genes ?? 0}</div><div class="metric-label">HPO関連遺伝子総数</div></div>
        </div>
        <p style="font-size:11px;color:var(--text-sub);margin:4px 0 10px;">
          重複スコア = 症状関連遺伝子と重複する PPI パートナー数 / min(PPIパートナー数, 症状遺伝子総数)
        </p>
        ${selfHtml}${tgHtml}${ptHtml}`;
    }
    if (source === "toxicity") {
      let toxcastHtml;
      if (!data.toxcast_available) {
        toxcastHtml = `<div style="font-size:12px;color:var(--text-sub);">${esc(data.toxcast_note||"ToxCast データ取得不可")}</div>`;
      } else {
        const dashSearch = a => `https://comptox.epa.gov/dashboard/assay-endpoints?search=${encodeURIComponent(a)}`;
        const rows = (data.assays||[]).map(a => `<tr>
          <td><a href="${dashSearch(a.assayComponentEndpointName||"")}" target="_blank">${esc(a.assayComponentEndpointName||"")}</a></td>
          <td style="font-size:11px;">${esc(a.geneSymbol||"")}</td>
          <td style="font-size:11px;">${esc(a.singleConcActive||"")}</td>
          <td style="font-size:11px;">${esc(a.multiConcActives||"")}</td></tr>`).join("");
        const geneUrl = data.gene ? dashSearch(data.gene) : "";
        toxcastHtml = `<div class="metric-row">
          <div class="metric"><div class="metric-val">${esc(data.assay_count||0)}</div><div class="metric-label">ToxCast Assay 件数</div></div>
        </div>
        ${geneUrl ? `<div style="margin:8px 0;font-size:12px;"><a href="${esc(geneUrl)}" target="_blank">🔗 ${esc(data.gene)} を EPA CompTox Dashboard で見る</a></div>` : ""}
        ${rows ? `<table class="data-table"><thead><tr><th>Assay</th><th>Gene</th><th>Single-conc Active</th><th>Multi-conc Actives</th></tr></thead><tbody>${rows}</tbody></table>` : ""}
        <div style="font-size:11px;color:var(--text-sub);margin-top:6px;">Source: EPA ToxCast/Tox21 via CTX Bioactivity API</div>`;
      }
      const ae = data.drug_adverse_events || {};
      const dailymedUrl = drug => `https://dailymed.nlm.nih.gov/dailymed/search.cfm?query=${encodeURIComponent(drug)}&audience=consumer`;
      const aeHtml = Object.keys(ae).length ? `<div class="data-section-title" style="margin-top:14px;">FDA有害事象 (openFDA)</div>` +
        Object.entries(ae).map(([drug, evts]) => `
          <div style="margin:6px 0;font-size:12px;">
            <strong>${esc(drug)}</strong>
            (<a href="${esc(dailymedUrl(drug))}" target="_blank">DailyMed 添付文書を見る</a>): ${
            (evts||[]).map(e=>`${esc(e.reaction)} (${esc(e.count)})`).join(", ")}</div>`).join("") : "";
      return toxcastHtml + aeHtml;
    }
  } catch(e) {}
  return `<pre style="font-size:11px;overflow:auto;">${esc(JSON.stringify(data,null,2))}</pre>`;
}

function renderPartnerFunctions(funcs) {
  if (!funcs || !funcs.length) return "";
  const rows = funcs.map(f => `
    <div style="margin-bottom:10px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
                ${f.is_target ? 'background:#eff6ff;border-color:#bfdbfe;' : ''}">
      <div style="font-weight:600;font-size:13px;font-family:monospace;">
        ${esc(f.gene)}${f.is_target ? ' <span class="badge">target</span>' : ''}
        <span style="font-weight:400;font-family:inherit;color:var(--text-sub);">${esc(f.protein_name||"")}</span>
      </div>
      <div class="abstract-text" style="margin-top:3px;">${esc(f.function||"")}</div>
    </div>`).join("");
  return `<div class="data-section-title" style="margin-top:16px;">
            タンパク質機能 (UniProt) — 対象遺伝子 + PPI遺伝子 ${funcs.length}件
          </div>${rows}`;
}

function renderExcludedHubs(hubs) {
  if (!hubs || !hubs.length) return "";
  const tags = hubs.map(h => {
    const note = h.reason === "family"
      ? "族"
      : (h.interactor_count >= 0 ? h.interactor_count : "?");
    return `<span style="display:inline-block;background:#fef2f2;border:1px solid #fecaca;
                  border-radius:4px;padding:1px 7px;margin:2px;font-size:11px;font-family:monospace;">
       ${esc(h.gene)} <span style="color:var(--text-sub)">(${note})</span>
     </span>`;
  }).join("");
  return `<div class="data-section-title" style="margin-top:16px;">
            エンリッチメントから除外したハブ遺伝子
            <span style="font-size:11px;font-weight:400;color:var(--text-sub);margin-left:6px;">
              相互作用数が閾値超（括弧内=数）／既知ハブ族（括弧内=族）は機能解析の特異性を下げるため除外
            </span>
          </div>
          <div>${tags}</div>`;
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Progress log ────────────────────────────────────────────────────────────
function logMsg(msg, cls = "") {
  const el = document.getElementById("progress-log");
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById("progress-log").innerHTML = "";
}

// ── 過去の解析結果一覧 ──────────────────────────────────────────────────────
let historyEntries = [];

async function showHistory() {
  const panel = document.getElementById("history-panel");
  panel.style.display = "block";
  panel.scrollIntoView({behavior: "smooth"});
  document.getElementById("history-list").innerHTML =
    '<span style="color:var(--text-sub);font-size:13px;">読み込み中...</span>';
  try {
    const r = await fetch("/api/history");
    const d = await r.json();
    historyEntries = d.entries || [];
    renderHistoryList();
  } catch (e) {
    document.getElementById("history-list").innerHTML =
      `<span style="color:var(--error);font-size:13px;">読み込みエラー: ${esc(e.message)}</span>`;
  }
}

function renderHistoryList() {
  const filter = (document.getElementById("history-filter").value || "").toLowerCase();
  const el = document.getElementById("history-list");
  const filtered = historyEntries.filter(e => e.dir.toLowerCase().includes(filter));
  if (!filtered.length) {
    el.innerHTML = '<span style="color:var(--text-sub);font-size:13px;">該当する結果がありません</span>';
    return;
  }
  el.innerHTML = filtered.map(e => {
    // ディレクトリ名例: "LRRK2_Parkinson_disease" → 表示用に整形
    const label = e.dir.replace(/_/g, " ");
    const ts = e.timestamp.replace(
      /(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/,
      "$1-$2-$3 $4:$5:$6"
    );
    const links = [];
    if (e.snapshot_url) links.push(`<a href="${esc(e.snapshot_url)}" target="_blank" class="btn btn-secondary btn-sm">🖥 Web表示</a>`);
    if (e.md_url) links.push(`<a href="${esc(e.md_url)}" target="_blank" class="btn btn-secondary btn-sm">📄 Markdown</a>`);
    const meta = [];
    if (e.model) meta.push(`モデル: ${esc(e.model)}`);
    if (e.ppi_sources && e.ppi_sources.length) meta.push(`PPI: ${esc(e.ppi_sources.join("/").toUpperCase())}`);
    if (e.string_score != null) meta.push(`STRING閾値: ${esc(e.string_score)}`);
    if (e.min_score != null) meta.push(`最小スコア: ${esc(e.min_score)}`);
    if (e.hub_threshold != null) meta.push(`ハブ除外: ${esc(e.hub_threshold)}`);
    if (e.max_nodes != null) meta.push(`最大パートナー: ${esc(e.max_nodes)}`);
    const metaHtml = meta.length
      ? `<div style="font-size:11px;color:var(--text-sub);margin-top:2px;">${meta.join(" ・ ")}</div>` : "";
    return `<div style="display:flex;align-items:center;justify-content:space-between;
                padding:10px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;">
      <div>
        <div style="font-weight:600;font-size:13px;">${esc(label)}</div>
        <div style="font-size:11px;color:var(--text-sub);">${esc(ts)}${e.lang?` ・ ${esc(e.lang)}`:""}</div>
        ${metaHtml}
      </div>
      <div style="display:flex;gap:6px;">${links.join("")}</div>
    </div>`;
  }).join("");
}

// ── スナップショット再生（サーバー無し・オフライン閲覧用） ─────────────────
// webapp/snapshot.py が生成する <script id="snapshot-data"> のデータを読み、
// 通常運用時に使っているのと同じ描画関数（createGeneCard 等）でそのまま
// 「取得データ／仮説／PPI／エンリッチメント／ダウンロード」全タブを再現する。
function renderSnapshot(snap) {
  const appEl = document.querySelector(".app");
  if (appEl) appEl.style.gridTemplateColumns = "1fr";
  const sidebar = document.querySelector(".sidebar");
  if (sidebar) sidebar.style.display = "none";
  const progressPanel = document.getElementById("progress-panel");
  if (progressPanel) progressPanel.style.display = "none";
  const emptyState = document.getElementById("empty-state");
  if (emptyState) emptyState.style.display = "none";
  const runBar = document.querySelector(".run-bar");
  if (runBar) runBar.style.display = "none";

  const mainTitle = document.getElementById("main-title");
  if (mainTitle) {
    mainTitle.textContent = `${snap.disease} — ${snap.gene}（保存済みスナップショット / ${snap.generated}）`;
  }
  document.title = `${snap.gene} × ${snap.disease} — スナップショット`;

  geneState[snap.gene] = { tokens: [], done: true };
  createGeneCard(snap.gene);

  // clinvar / toxicity / clinicaltrials / pathway_fit / network_overlap は
  // initCollectorGrid の concat か updateCollectorChip の動的生成で追加されるため除外
  const _LATE_SOURCES = new Set(["clinvar","toxicity","clinicaltrials","pathway_fit","network_overlap","hpo_overlap"]);
  const sources = Object.keys(snap.collectors || {}).filter(s => !_LATE_SOURCES.has(s));
  initCollectorGrid(snap.gene, sources);
  for (const [src, c] of Object.entries(snap.collectors || {})) {
    updateCollectorChip(snap.gene, src, c.ok, c.summary, c.data);
  }

  finalizeGene(snap.gene, {
    hypothesis: snap.hypothesis,
    ppi_image: snap.ppi_image,
    partners: snap.partners,
    partner_functions: snap.partner_functions,
    enrichment_results: snap.enrichment_results,
    excluded_hubs: snap.excluded_hubs,
    path: snap.report_filename,
  });
  // finalizeGene 内の仮説フォールバック（switchToHypothesisTab）が
  // ステータスを「仮説生成中...」に書き換えるため、最後に確定させる。
  setGeneStatus(snap.gene, "done", "✓ 完了");

  // 常に「仮説」タブを開いた状態で表示する
  showTab(cardId(snap.gene), "hyp", { stopPropagation(){}, currentTarget: document.querySelector(`#${cardId(snap.gene)} .tab-btn`) });
}
</script>
