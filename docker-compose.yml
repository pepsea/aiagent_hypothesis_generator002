services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      # ホストで動くOllamaに接続する。
      # Mac/Windows Docker Desktop: host.docker.internal が使える。
      # Linux: host-gateway を extra_hosts で解決する（下記参照）。
      - OLLAMA_HOST=http://host.docker.internal:11434
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./ppi_cache:/app/ppi_cache
    extra_hosts:
      # Linux環境でホストのOllamaに繋ぐために必要（Mac/Windowsでは不要だが無害）
      - "host.docker.internal:host-gateway"
